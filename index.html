<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <title>pra ti 💚</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #a8e6cf 0%, #3d8168 60%, #1b4332 100%);
      color: #1b4332;
      overflow: hidden;
    }

    .petal {
      position: fixed;
      font-size: 1.4rem;
      animation: fall linear infinite;
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes fall {
      0%   { transform: translateY(-60px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      background: rgba(240, 247, 244, 0.92);
      backdrop-filter: blur(10px);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      max-width: 400px;
      width: 90%;
      animation: fadeUp 0.8s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 0.3rem;
      color: #1b4332;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #3d8168;
      margin-bottom: 1.8rem;
      font-weight: 300;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      font-family: 'Lato', sans-serif;
      border: 2px solid #a8e6cf;
      border-radius: 12px;
      background: #fff;
      color: #1b4332;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    input:focus {
      border-color: #3d8168;
      box-shadow: 0 0 0 4px rgba(61,129,104,0.15);
    }

    button {
      margin-top: 1.2rem;
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: linear-gradient(135deg, #3d8168, #1b4332);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Lato', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(27,67,50,0.3);
    }
    button:active { transform: translateY(0); }

    .error {
      color: #e63946;
      margin-top: 0.6rem;
      font-size: 0.875rem;
      display: none;
    }
  </style>
</head>

<body>

<script>
  const emojis = ["🌿","💚","🍃","✨","🌸"];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement("div");
    el.className = "petal";
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (6 + Math.random() * 10) + "s";
    el.style.animationDelay = (Math.random() * 10) + "s";
    el.style.fontSize = (1 + Math.random() * 1.2) + "rem";
    document.body.appendChild(el);
  }
</script>

<div class="container">
  <h1>Quem é você? 💚</h1>
  <p class="subtitle">uma mensagem especial te espera...</p>
  <input id="nameInput" type="text" placeholder="Seu nome..." />
  <button id="enterButton">Entrar ✨</button>
  <p class="error" id="errorMessage">Digite um nome válido 😅</p>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrA_EaPLiPhMAfsGOOWrBcIhJCF7-8oXKfFz5O73d8n7uoL-5xh1SC8HEtSr3G5OXk/exec";

  let userChoices = { name: "", activity: "", place: "", date: "", time: "" };

  const activityMap = {
    casual:  "🍕 Barzinho",
    dinner:  "🍽️ Jantar",
    lunch:   "🍔 Almoço",
    park:    "🌳 Parque",
    cafe:    "☕ Café"
  };

  function startValentinesInvite() {
    Swal.fire({
      title: "EBA, É você! 💖",
      text: `Oi ${userChoices.name}, gostaria de sair comigo? :>`,
      imageUrl: "https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif",
      imageWidth: 200,
      showDenyButton: true,
      showCancelButton: true,
      confirmButtonText: "Sim! 💘",
      denyButtonText: "Não 😢",
      cancelButtonText: "Talvez 🤔",
    }).then((result) => {
      if (result.isConfirmed)      askPreferences();
      else if (result.isDenied)    Swal.fire("Poxa 😢", "Mas tudo bem, te desejo um ótimo dia 💚");
      else                         Swal.fire("Sem pressa 😌", "Quando quiser, me chama 💚");
    });
  }

  function askPreferences() {
    Swal.fire({
      title: "Perfeito! 💞",
      text: "O que você gostaria de fazer?",
      input: "select",
      inputOptions: activityMap,
      inputPlaceholder: "Escolha algo",
      showCancelButton: true,
    }).then((result) => {
      if (!result.value) return cancelFlow();
      userChoices.activity = result.value;
      askPlace();
    });
  }

  function askPlace() {
    Swal.fire({
      title: "Boa escolha 😏",
      text: "Onde você gostaria de ir?",
      input: "text",
      inputPlaceholder: "Ex: um lugar especial...",
      showCancelButton: true,
    }).then((result) => {
      if (!result.value) return cancelFlow();
      userChoices.place = result.value;
      askDate();
    });
  }

  function askDate() {
    Swal.fire({
      title: "Escolha a data 📅",
      input: "date",
      showCancelButton: true,
    }).then((result) => {
      if (!result.value) return cancelFlow();
      userChoices.date = result.value;
      askTime();
    });
  }

  function askTime() {
    Swal.fire({
      title: "Agora o horário ⏰",
      input: "select",
      inputOptions: {
        morning:   "🌅 Manhã",
        afternoon: "🌞 Tarde",
        evening:   "🌙 Noite",
      },
      inputPlaceholder: "Selecione",
      showCancelButton: true,
    }).then((result) => {
      if (!result.value) return cancelFlow();
      userChoices.time = result.value;
      showSummary();
    });
  }

  function showSummary() {
    const timeMap = { morning: "Manhã 🌅", afternoon: "Tarde 🌞", evening: "Noite 🌙" };
    const formattedDate = new Date(userChoices.date).toLocaleDateString("pt-BR");

    Swal.fire({
      title: "Temos um encontro! 🎉",
      html: `
        <p><b>Nome:</b> ${userChoices.name}</p>
        <p><b>Atividade:</b> ${activityMap[userChoices.activity]}</p>
        <p><b>Local:</b> ${userChoices.place}</p>
        <p><b>Data:</b> ${formattedDate}</p>
        <p><b>Hora:</b> ${timeMap[userChoices.time]}</p>
      `,
      icon: "success",
      confirmButtonText: "Mal posso esperar 💘",
    });

    // Envia para o Google Sheets
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(userChoices),
    })
    .then(() => console.log("✅ Enviado para o Google Sheets"))
    .catch((err) => console.log("❌ Erro ao enviar:", err));
  }

  function cancelFlow() {
    Swal.fire("Tudo bem 😅", "A gente tenta outro dia!", "info");
  }

  const enterButton  = document.getElementById("enterButton");
  const nameInput    = document.getElementById("nameInput");
  const errorMessage = document.getElementById("errorMessage");

  enterButton.addEventListener("click", () => {
    const name = nameInput.value.trim();
    if (name.length < 2) { errorMessage.style.display = "block"; return; }
    userChoices.name = name;
    errorMessage.style.display = "none";
    startValentinesInvite();
  });

  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") enterButton.click();
  });
</script>

</body>
</html>
